spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ops-assistant:
  ai:
    primary-provider: ${AI_PRIMARY_PROVIDER:deepseek}
    backup-provider: ${AI_BACKUP_PROVIDER:bailian}
    providers:
      deepseek:
        enabled: true
        base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${AI_DEEPSEEK_API_KEY:}
        model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
        temperature: ${AI_DEEPSEEK_TEMPERATURE:0.2}
        max-tokens: ${AI_DEEPSEEK_MAX_TOKENS:2000}
        timeout: ${AI_DEEPSEEK_TIMEOUT:45s}
      bailian:
        enabled: true
        base-url: ${AI_BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${AI_BAILIAN_API_KEY:}
        model: ${AI_BAILIAN_MODEL:qwen-plus}
        temperature: ${AI_BAILIAN_TEMPERATURE:0.2}
        max-tokens: ${AI_BAILIAN_MAX_TOKENS:2000}
        timeout: ${AI_BAILIAN_TIMEOUT:45s}

